<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmSecure - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e5631 0%, #004d00 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            padding: 50px 40px;
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-circle {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #1e5631 0%, #004d00 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            color: white;
            box-shadow: 0 4px 15px rgba(30, 86, 49, 0.3);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #1e5631;
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 700;
        }
        
        .header p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #1e5631;
        }
        
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1e5631 0%, #004d00 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
        }
        
        .demo-credentials {
            background: #f5f5f5;
            border-left: 4px solid #1e5631;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
        }
        
        .demo-credentials h3 {
            color: #1e5631;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .demo-credentials p {
            color: #666;
            font-size: 12px;
            margin: 5px 0;
            font-family: 'Courier New', monospace;
        }
        
        .message {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <div class="logo-circle">💊</div>
        </div>
        
        <div class="header">
            <h1>PharmSecure</h1>
            <p>Pharmacy Anti-Counterfeiting Platform</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="pharmacy@ghs.com" value="pharmacy@ghs.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" value="demo123" required>
            </div>
            
            <button type="submit" class="login-btn">LOGIN</button>
            
            <div class="message" id="message"></div>
        </form>
        
        <div class="demo-credentials">
            <h3>📝 Demo Credentials</h3>
            <p><strong>Username:</strong> pharmacy@ghs.com</p>
            <p><strong>Password:</strong> demo123</p>
            <p style="margin-top: 8px; font-size: 11px;">Alternative: manager@pharma.com / password123</p>
        </div>
    </div>
    
    <script>
        const API_URL = "https://6532-154-161-85-133.ngrok-free.app";
        
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const messageDiv = document.getElementById("message");
            
            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.detail || "Login failed");
                }
                
                localStorage.setItem("token", data.access_token);
                localStorage.setItem("username", data.user);
                
                messageDiv.textContent = "✅ Login successful! Redirecting...";
                messageDiv.className = "message success";
                
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1000);
                
            } catch (error) {
                messageDiv.textContent = "❌ " + error.message;
                messageDiv.className = "message error";
            }
        });
    </script>
</body>
</html>
