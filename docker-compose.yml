version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: pharmacy_security_db
    environment:
      POSTGRES_USER: ${DB_USER:-security_mvp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_change_me}
      POSTGRES_DB: ${DB_NAME:-security_mvp}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./security-mvp-schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-security_mvp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - security_mvp_network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pharmacy_security_api
    environment:
      DATABASE_URL: postgresql://${DB_USER:-security_mvp}:${DB_PASSWORD:-secure_password_change_me}@db:5432/${DB_NAME:-security_mvp}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./security-mvp-api.py:/app/main.py
      - ./logs:/app/logs
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - security_mvp_network

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pharmacy_security_dashboard
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_API_TIMEOUT: 30000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./src:/app/src
      - /app/node_modules
    command: npm start
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - security_mvp_network

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: pharmacy_security_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - security_mvp_network
    profiles:
      - production

volumes:
  postgres_data:
    driver: local

networks:
  security_mvp_network:
    driver: bridge
